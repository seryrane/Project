# 스프링 벌 — FastAPI 벌(:8080, 정본)과 같은 API 를 :8081 에서 낸다.
# 프런트를 이 벌로 돌리려면 frontend/vite.config.ts 의 proxy 대상만 8081 로 바꾼다.
spring:
  application:
    name: backend

  # 기본: H2 를 PostgreSQL 호환 모드로(파일 저장 — 재기동해도 남는다).
  # 이 PC 에 PG 서버가 없어서(도커 불가) 로컬 검증용이다. 실 PG 는 postgres 프로필.
  datasource:
    url: jdbc:h2:file:./data/hmg;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  sql:
    init:
      mode: always # schema.sql 은 IF NOT EXISTS 라 몇 번 돌아도 안전하다

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# 실 PostgreSQL — 접속 정보는 환경변수로 (자격증명을 저장소에 넣지 않는다)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${HMG_PG_URL:jdbc:postgresql://localhost:5432/hmg}
    driver-class-name: org.postgresql.Driver
    username: ${HMG_PG_USER:hmg}
    password: ${HMG_PG_PASSWORD:}
